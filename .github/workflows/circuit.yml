name: Contribution Circuit

on:
  schedule:
    - cron: "17 3 * * *"     # once a day
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  race:
    name: Lap the year
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution circuit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate-circuit.py

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-circuit.svg
          git commit -q -m "Update contribution circuit"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
